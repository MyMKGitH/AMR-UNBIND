[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-unbind"
version = "1.3.2"
description = "Antimicrobial Resistance Ligand Unbinding workflow"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "AMR-UNBIND Contributors"}]
license = {text = "MIT"}

[project.scripts]
amr-unbind = "amr_unbind.cli:main"

[tool.setuptools]
packages = ["amr_unbind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
